<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SECURE LLM GATEWAY FRAMEWORK</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="display: block; margin-bottom: 25px; color: #e2e8f0; letter-spacing: 1px; font-weight: 700;">Gateway Login</h2>
        
        <input type="text" id="username" class="login-input" placeholder="Username">
        
        <div style="position: relative; width: 100%; margin-bottom: 25px;">
            <input type="password" id="password" class="login-input" placeholder="Password" style="margin-bottom: 0; padding-right: 40px;" onkeypress="if(event.key==='Enter') performLogin()">
            <span class="eye-btn" onclick="togglePasswordVisibility()">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </span>
        </div>

        <button class="btn-action" style="width: 100%; padding: 15px;" onclick="performLogin()">Access Framework</button>
        <p id="loginError" style="color: #f87171; font-size: 0.85em; display: none; margin-top: 15px;">Invalid Username or Password!</p>
    </div>
</div>

<div class="container" id="pdf-export-area" style="display: none;">
    
    <button class="btn-logout" onclick="logout()" data-html2canvas-ignore>LOGOUT</button>

    <h1 style="font-weight: 700; letter-spacing: 1px; text-align: center; margin-bottom: 30px; color: #f8fafc; text-transform: uppercase; font-size: clamp(1.8rem, 3vw, 2.6rem);">
        SECURE LLM GATEWAY FRAMEWORK
    </h1>

    <div class="dashboard-grid">
        <div class="main-column">
            <div style="display: flex; gap: 15px; margin-bottom: 25px;">
                <div class="glass-card stat-card" style="flex: 1;">
                    <span class="stat-label">Total Messages</span>
                    <span class="stat-val" id="total-msgs">0</span>
                </div>
                <div class="glass-card stat-card" style="flex: 1;">
                    <span class="stat-label">Threats Blocked</span>
                    <span class="stat-val" id="threats-blocked" style="color:#fca5a5">0</span>
                </div>
                <div class="glass-card stat-card" style="flex: 1;">
                    <span class="stat-label">SENSITIVE ENTITIES DETECTED</span>
                    <span class="stat-val" id="entities-detected" style="color:#fcd34d">0</span>
                </div>
            </div>

            <div class="glass-card">
                <div id="chatbox"></div>
                
                <div class="mask-controls" data-html2canvas-ignore>
                    <label><input type="checkbox" id="maskName" checked> Names</label>
                    <label><input type="checkbox" id="maskPhone" checked> Phone</label>
                    <label><input type="checkbox" id="maskEmail" checked> Email</label>
                    <label><input type="checkbox" id="maskAddress" checked> Address</label>
                    <label><input type="checkbox" id="maskCard" checked> Cards</label>
                    <label style="opacity: 0.6; cursor: not-allowed;" title="Mandatory Security Protocol"><input type="checkbox" checked disabled> Govt IDs</label>
                </div>

                <div class="controls" data-html2canvas-ignore>
                    <input type="file" id="fileInput" hidden onchange="uploadFile()">
                    
                    <button class="btn-secondary" onclick="document.getElementById('fileInput').click()" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 80px; gap: 4px; padding: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #cbd5e1;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="12" y1="18" x2="12" y2="12"></line>
                            <polyline points="9 15 12 12 15 15"></polyline>
                        </svg>
                        <span style="font-size: 0.65em; font-weight: 800; letter-spacing: 1px; color: #94a3b8;">UPLOAD</span>
                    </button>

                    <input type="text" id="userInput" placeholder="Type message or upload a file..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn-action" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <div class="sidebar-column" style="display: flex; flex-direction: column; gap: 20px;">
            <div class="glass-card">
                <span class="stat-label">Real-Time Threat Heatmap</span>
                <div class="heatmap" id="heatmapContainer"></div>
                <button class="btn-secondary" onclick="clearHeatmap()" style="width: 100%; margin-top: 15px; color: #fca5a5; font-size: 0.85em;" data-html2canvas-ignore>Clear Heatmap Data</button>
            </div>
            
            <div class="glass-card" style="text-align: center;">
                <span class="stat-label">Threat Type Breakdown</span>
                <div style="height: 280px; margin-top: 15px;">
                    <canvas id="threadPieChart"></canvas>
                </div>
                <button class="btn-secondary" onclick="clearPieChart()" style="width: 100%; margin-top: 15px; color: #fca5a5; font-size: 0.85em;" data-html2canvas-ignore>Clear Piechart Data</button>
            </div>
        </div>
    </div>

    <div class="header-flex">
        <h2 class="stat-label" style="font-size: 1.2em;">📊 Audit History Logs</h2>
        
        <div data-html2canvas-ignore>
            <button class="btn-secondary" onclick="downloadPDF()" style="color: #cbd5e1; margin-right: 10px;">Export PDF</button>
            <button class="btn-secondary" onclick="exportCSV()" style="color: #bbf7d0;">Export CSV</button>
            <button class="btn-secondary" onclick="clearEverything()" style="color: #fca5a5; margin-left:10px;">Clear Chat & History</button>
        </div>
    </div>

    <table id="historyTable">
        <thead>
            <tr>
                <th>Original Input</th>
                <th>Secured (Masked/Unmasked)</th>
                <th>Risk Level</th>
                <th>AI Response</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <div style="display: flex; justify-content: flex-end; margin-top: 10px;" data-html2canvas-ignore>
        <button id="seeMoreBtn" class="btn-secondary" style="display: none; padding: 6px 14px; font-size: 0.8em; border-color: transparent; background: transparent; color: #cbd5e1;" onclick="toggleLogs()">See More ▼</button>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
